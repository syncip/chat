# Chat-Server inkl. Web-Client.
#   1. cp .env.example .env   und CHAT_DOMAIN, CHAT_ADMIN_KEY anpassen
#   2. docker compose up -d --build
#   3. Erste Einladung (24 h gültig):  docker compose logs chat | grep Einladung
# Ohne Domain: CHAT_DOMAIN=<IP>:<PORT> und CHAT_BIND=0.0.0.0:<PORT> setzen (siehe README).
# Die App ist unabhängig von Tunneln. Optionale Tunnel-Beispiele: deploy/ (siehe deploy/README.md).
services:
  chat:
    build: .
    image: syncip/chat:latest
    restart: unless-stopped
    environment:
      # Pflicht
      CHAT_DOMAIN: ${CHAT_DOMAIN:?CHAT_DOMAIN setzen (öffentlicher Hostname, Teil der Adressen name@domain)}
      CHAT_ADMIN_KEY: ${CHAT_ADMIN_KEY:?CHAT_ADMIN_KEY setzen (z. B. openssl rand -hex 24)}
      # Zugang und Föderation
      CHAT_REGISTRATION: ${CHAT_REGISTRATION:-invite}          # invite | open | closed
      CHAT_USER_INVITES: ${CHAT_USER_INVITES:-false}           # dürfen Nutzer Einladungen erzeugen?
      CHAT_FEDERATION: ${CHAT_FEDERATION:-open}                # open | allowlist | closed
      CHAT_FEDERATION_ALLOW: ${CHAT_FEDERATION_ALLOW:-}        # kommagetrennt, bei allowlist
      CHAT_FEDERATION_ALLOW_PRIVATE: ${CHAT_FEDERATION_ALLOW_PRIVATE:-false}  # LAN-Föderation (private IPs) erlauben
      CHAT_FEDERATION_BLOCK: ${CHAT_FEDERATION_BLOCK:-}        # kommagetrennt
      # Limits (Bytes)
      CHAT_MAX_FILE_SIZE: ${CHAT_MAX_FILE_SIZE:-104857600}                    # 100 MB pro Datei
      CHAT_MAX_MESSAGE_ATTACHMENTS: ${CHAT_MAX_MESSAGE_ATTACHMENTS:-10}       # Dateien pro Nachricht
      CHAT_MAX_MESSAGE_TOTAL_SIZE: ${CHAT_MAX_MESSAGE_TOTAL_SIZE:-524288000}  # Gesamtgröße pro Nachricht
      CHAT_USER_QUOTA: ${CHAT_USER_QUOTA:-10737418240}                        # 10 GB pro Nutzer
      CHAT_BLOB_RETENTION_DAYS: ${CHAT_BLOB_RETENTION_DAYS:-30}
      CHAT_MESSAGE_RETENTION_DAYS: ${CHAT_MESSAGE_RETENTION_DAYS:-30}
      # Nur falls ein Reverse-Proxy/Tunnel davor steht: Header mit der Client-IP (nur für Rate-Limits, es wird nichts geloggt).
      # Leer lassen, wenn der Server direkt erreichbar ist.
      CHAT_CHANNELS: ${CHAT_CHANNELS:-true}                    # öffentliche Kanäle
      CHAT_MAX_CHANNELS: ${CHAT_MAX_CHANNELS:-10}              # Kanäle je Nutzer
      CHAT_MAX_CHANNEL_MEMBERS: ${CHAT_MAX_CHANNEL_MEMBERS:-5000}
      CHAT_MAX_HOOKS: ${CHAT_MAX_HOOKS:-5}                     # Webhooks je Kanal
      CHAT_TRUST_PROXY_HEADER: ${CHAT_TRUST_PROXY_HEADER:-}
    volumes:
      - chat-data:/data
    ports:
      - "${CHAT_BIND:-127.0.0.1:8080}:8080"   # Standard: nur lokal. Für öffentlichen Betrieb TLS davorsetzen (beliebiger Reverse-Proxy/Tunnel)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  chat-data:
