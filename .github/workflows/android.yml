name: Android
on:
  push:
    paths: ["android/**", "core/**", "server/**", ".github/workflows/android.yml", "scripts/build-android-core.sh"]
  pull_request:
    paths: ["android/**", "core/**", ".github/workflows/android.yml"]

jobs:
  engine-tests:
    name: Kotlin-Engine gegen echten Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - run: go build -o chatd ./cmd/chatd
        working-directory: server
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :engine:test -Pchatd=${{ github.workspace }}/server/chatd
        working-directory: android

  apk:
    name: APK bauen (Debug) + Lint
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Der ubuntu-Runner bringt das Android SDK mit (ANDROID_HOME); wir installieren nur die benötigten Pakete.
      - name: SDK-Pakete installieren
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - run: cargo install cargo-ndk --locked
      - name: Rust-Kern für Android bauen
        env: { ANDROID_NDK_HOME: "/usr/local/lib/android/sdk/ndk/27.2.12479018" }
        run: ./scripts/build-android-core.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug-APK + Lint
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:lintDebug
      - name: Lint-Fehler anzeigen
        if: failure()
        run: grep -h -A4 "Error:" android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt | head -80 || true
      - uses: actions/upload-artifact@v4
        with: { name: chat-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
      # Release-APK (R8, signiert). Mit dem Repository-Secret ANDROID_KEYSTORE_B64 (+ _PASSWORD, _ALIAS) wird der eigene Schlüssel genutzt,
      # sonst der öffentliche Test-Schlüssel aus dem Repository (gleich bleibende Signatur: Updates lassen sich installieren; nicht für den Produktivbetrieb).
      - name: Release-APK bauen
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            KS="$RUNNER_TEMP/release.jks"; echo "$KS_B64" | base64 -d > "$KS"
            CHAT_KEYSTORE="$KS" CHAT_KEYSTORE_PASSWORD="$KS_PASS" CHAT_KEY_ALIAS="$KS_ALIAS" CHAT_KEY_PASSWORD="$KS_PASS" ./gradlew :app:assembleRelease
          else
            ./gradlew :app:assembleRelease
          fi
      - uses: actions/upload-artifact@v4
        with: { name: chat-release-apk, path: android/app/build/outputs/apk/release/*.apk }
      # Direkt herunterladbare APK (auch am Handy, ohne ZIP und ohne Anmeldung): fortlaufend aktualisierte Vorab-Version „android-latest“.
      - name: APK als Vorab-Release „android-latest“ veröffentlichen
        if: github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/chat-0.3.0-build-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/debug/*.apk "dist/chat-test-0.3.0-build-${GITHUB_RUN_NUMBER}.apk"
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest dist/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android – neueste Version (Build ${GITHUB_RUN_NUMBER})" \
            --notes "Automatisch gebaut aus ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). chat-…apk ist die normale App; chat-test-…apk installiert sich zusätzlich als „Chat (Test)“. Signiert mit dem öffentlichen Test-Schlüssel, solange kein eigener hinterlegt ist."

  emulator:
    name: Emulator-Tests (echte App gegen echten Server)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - name: Server starten (für den Emulator unter 10.0.2.2:18200)
        working-directory: server
        run: |
          go build -o chatd ./cmd/chatd
          mkdir -p /tmp/chatd-data
          CHAT_DOMAIN=10.0.2.2:18200 CHAT_LISTEN=0.0.0.0:18200 CHAT_DATA_DIR=/tmp/chatd-data CHAT_ADMIN_KEY=emulator-admin-key \
            CHAT_RATE_PER_MINUTE=100000 CHAT_MIN_PASSPHRASE=8 nohup ./chatd > /tmp/chatd.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:18200/v1/server-info && break; sleep 0.2; done
      - name: SDK-Pakete installieren
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - run: cargo install cargo-ndk --locked
      - name: Rust-Kern für Android bauen
        env: { ANDROID_NDK_HOME: "/usr/local/lib/android/sdk/ndk/27.2.12479018" }
        run: ./scripts/build-android-core.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: App + Test-APK bauen
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Tests auf dem Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.chatServer=10.0.2.2:18200 -Pandroid.testInstrumentationRunnerArguments.chatAdminKey=emulator-admin-key || (adb logcat -d > /tmp/logcat.txt; grep -E "AppFlowTest|TestRunner|System.err|E chat|AndroidRuntime" /tmp/logcat.txt | grep -v THREAD_STATE | head -n 400; exit 1)
            python3 scripts/release_smoke.py app/build/outputs/apk/release/app-release.apk
      - name: Server-Log und Test-Berichte
        if: always()
        run: |
          tail -n 80 /tmp/chatd.log || true
          find android/app/build/outputs/androidTest-results -name "*.xml" -exec grep -l "failure" {} \; -exec sed -n '1,200p' {} \; 2>/dev/null | head -300 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: emulator-test-report, path: android/app/build/reports/androidTests }
