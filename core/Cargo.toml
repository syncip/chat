[package]
name = "chat-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "0.6", features = ["js"] }
openmls_rust_crypto = "0.3"
openmls_basic_credential = "0.3"
openmls_traits = "0.3"
tls_codec = { version = "0.4", features = ["derive", "serde", "mls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
